# Nome do workflow 
name: CI

# Gatilho (Trigger) para o workflow
on:
  push:

jobs:
  
  #=========================================== 
  # === JOB : LINT === 
  lint:   
    runs-on: ubuntu-latest

    steps:

      #===========================================
      # === Configuração do Runner e Ambiente === 
      - name: Baixar código no runner
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      
      # ===========================================
      # === Executar Lint com Ruff === 

      - name: Executar Lint
        run: python -m ruff check .

      # ===========================================
  # ==================================================
  
  # JOB : TEST 
  test: 
    runs-on: ubuntu-latest 
    needs: lint


    steps: 

      # ===========================================
      # === Configuração do Runner e Ambiente ===
      - name: Baixar código no runner
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      # ===========================================
      # === Executar Testes com Pytest ===
       
      - name: Executar Pytest
        run: python -m pytest -v
      # ===========================================
    # ==================================================

  # JOB : BUILD
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:

      # ===========================================
      # === Configuração do Runner e Ambiente ===
      - name: Baixar código no runner
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      # ===========================================
      # === Executar Build ===

      - name: Executa Build
        run: python -m compileall -q app scripts tasks.py
      # ===========================================
  # ==================================================

  release: 
    runs-on: ubuntu-latest 
    needs: build 

    steps: 
      
      # ===========================================
      # === Configuração do Runner e Ambiente ===
      - name: Baixar código no runner 
        uses: actions/checkout@v4 

      # ===========================================
      # === Criar a imagem Docker === 
      - name: Criar imagem Docker 
        run: docker build --pull -t minimercado-gabrielcirino:1.0 .

      # ===========================================
      # === Checar vulnerabilidades na imagem Docker === 
      - name: Checar vulnerabilidades na imagem Docker 
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
          scan-type: 'image'
          image-ref: 'minimercado-gabrielcirino:1.0'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'     

      # ===========================================
      # === Login no Docker Hub ===
      - name: Login no Docker Hub 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_GABRIEL_CIRINO }}
          password: ${{ secrets.DOCKER_TOKEN_GABRIEL_CIRINO}}

      # ===========================================
      # === Rotular a imagem Docker ===
      - name: Rotular Imagem Docker 
        run: docker tag minimercado-gabrielcirino:1.0 ${{ secrets.DOCKER_USERNAME_GABRIEL_CIRINO }}/minimercado-gabrielcirino:1.0

      # ===========================================
      # === Publicar a imagem Docker no Docker Hub ===
      - name: Publicar a imagem no Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME_GABRIEL_CIRINO }}/minimercado-gabrielcirino:1.0 
      


  