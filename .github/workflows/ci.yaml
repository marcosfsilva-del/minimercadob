# Nome do workflow 
name: CI

# Gatilho (Trigger) para o workflow
on:
  push:

jobs:
  
  #=========================================== 
  # === JOB : LINT === 
  lint:   
    runs-on: ubuntu-latest

    steps:

      #===========================================
      # === Configuração do Runner e Ambiente === 
      - name: Baixar código no runner
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      
      # ===========================================
      # === Executar Lint com Ruff === 

      - name: Executar Lint
        run: python -m ruff check .

      # ===========================================
  # ==================================================
  
  # JOB : TEST 
  test: 
    runs-on: ubuntu-latest 
    needs: lint


    steps: 

      # ===========================================
      # === Configuração do Runner e Ambiente ===
      - name: Baixar código no runner
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      # ===========================================
      # === Executar Testes com Pytest ===
       
      - name: Executar Pytest
        run: python -m pytest -v
      # ===========================================
    # ==================================================

  # JOB : BUILD
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:

      # ===========================================
      # === Configuração do Runner e Ambiente ===
      - name: Baixar código no runner
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      # ===========================================
      # === Executar Build ===

      - name: Executa Build
        run: python -m compileall -q app scripts tasks.py
      # ===========================================
  # ==================================================

  docker-build: 
    runs-on: ubuntu-latest 
    needs: build 

    steps: 
      
      # ===========================================
      # === Configuração do Runner e Ambiente ===
      - name: Baixar código no runner 
        uses: actions/checkout@v6 

      # ===========================================
      # === Criar a imagem Docker === 
      - name: Criar imagem Docker 
        run: docker build -t minimercado-gabrielcirino:1.0 .

      # ===========================================
      # === Checar vulnerabilidades na imagem Docker === 
      - name: Checar vulnerabilidades na imagem Docker 
        uses: aquasecurity/trivy-action@v0.9.0
        with: 
          scan-type: 'image'
          image-ref: 'minimercado-gabrielcirino:1.0'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'     

  