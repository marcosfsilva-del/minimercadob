name: CI

on:
  push:

jobs:
  lint:
    name: LINT
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Lint com Ruff
        run: python -m ruff check .

  test:
    name: TEST
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Testes com Pytest
        run: python -m pytest -v

  build:
    name: BUILD
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Build com compileall
        run: python -m compileall -q app scripts tasks.py

  release:
    name: RELEASE
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Criar imagem
        run: docker build -t minimercadob-mariaclarapma:1.0 .

      - name: Checar vulnerabilidade
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: minimercadob-mariaclarapma:1.0
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_MARIACLARA }}
          password: ${{ secrets.DOCKER_TOKEN_MARIACLARA }}

      - name: Enviar imagem com o commit
        run: |
          docker tag minimercadob-mariaclarapma:1.0 ${{ secrets.DOCKER_USERNAME_MARIACLARA }}/minimercadob-mariaclarapma:${GITHUB_SHA::7}
          docker push ${{ secrets.DOCKER_USERNAME_MARIACLARA }}/minimercadob-mariaclarapma:${GITHUB_SHA::7}

      - name: Enviar imagem latest
        run: |
          docker tag minimercadob-mariaclarapma:1.0 ${{ secrets.DOCKER_USERNAME_MARIACLARA }}/minimercadob-mariaclarapma:latest
          docker push ${{ secrets.DOCKER_USERNAME_MARIACLARA }}/minimercadob-mariaclarapma:latest

  deploy:
    name: DEPLOY
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no Render
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK_MARIACLARA }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Secret DEPLOY_HOOK_MARIACLARA ainda nao cadastrado. Deploy pulado."
            exit 0
          fi
          curl --fail --request POST "$DEPLOY_HOOK"
