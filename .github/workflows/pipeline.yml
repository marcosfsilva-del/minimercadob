
name: CI

on:
  push:

jobs:
  lint:
    name: LINT
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar codigo com Ruff
        run: python -m ruff check .

  test:
    name: TEST
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Testes com Pytest
        run: python -m pytest -v

  build:
    name: BUILD
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Build com compileall
        run: python -m compileall -q app scripts tasks.py
  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
      - name: Criar Imagem
        run: docker build -t minimercado-renata:1.0 .
      - name: Checar Vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: minimercado-renata:1.0
          severity: "HIGH,CRITICAL"
          exit-code: '0'
      - name: Login no dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME_RENATA}}
          password: ${{secrets.DOCKER_TOKEN_RENATA}}
    
      - name: Rotular Imagem
        run: docker tag minimercado-renata:1.0 ${{secrets.DOCKER_USERNAME_RENATA}}/minimercado-renata:1.0

      - name: Push to Docker
        run: docker push ${{secrets.DOCKER_USERNAME_RENATA}}/minimercado-renata:1.0
