name: CI
on:
  push:

env:
  IMAGE_NAME: devops-market

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Lint com Ruff
        run: python -m ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Testes com Pytest
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Build com compileall
        run: python -m compileall -q app scripts tasks.py

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Criar Imagem
        run: docker build --platform linux/amd64 --build-arg COMMIT_SHA=${{ github.sha }} -t ${{ env.IMAGE_NAME }}:1.0 .

      - name: Checar Vulnerabilidades
        uses: aquasecurity/trivy-action@v0.9.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:1.0'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Rotular Imagem
        run: docker tag ${{ env.IMAGE_NAME }}:1.0 ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}

      - name: Push to Docker
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}

      - name: Rotular imagem latest
        run: docker tag ${{ env.IMAGE_NAME }}:1.0 ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Push to Docker latest
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: release
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Disparar deploy no Render
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Erro: secret RENDER_DEPLOY_HOOK_URL nao configurado."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health Check do minimercado
        run: |
          BASE_URL="${{ vars.RENDER_APP_URL }}"
          BASE_URL="${BASE_URL%/}"
          if [ -z "$BASE_URL" ]; then
            echo "Erro: variavel RENDER_APP_URL nao configurada em Variables."
            exit 1
          fi
          for tentativa in $(seq 1 24); do
            echo "Tentativa ${tentativa}/24: ${BASE_URL}/api/health"
            if curl -fsS -m 10 "${BASE_URL}/api/health" | grep -Eq '"status":[[:space:]]*"ok"'; then
              echo "Health check passou!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check falhou"
          exit 1
