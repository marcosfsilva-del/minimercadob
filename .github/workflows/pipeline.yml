
name: CI

on:
  push:

jobs:
  lint:
    name: LINT
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar codigo com Ruff
        run: python -m ruff check .

  test:
    name: TEST
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Testes com Pytest
        run: python -m pytest -v

  build:
    name: BUILD
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Build com compileall
        run: python -m compileall -q app scripts tasks.py