name: "DevOps Market - CI Actions"

on:
  push:
  pull_request:

jobs:    
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code for runner
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install -r requirements-dev.txt

      - name: Execute lint
        run: python -m ruff check .
  test:
    needs: "lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code for runner
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
      
  build:
    needs: "test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code for runner
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install -r requirements-dev.txt

      - name: Build app
        run: python -m compileall -q app scripts tasks.py
      
  docker-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code for runner
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t minimercado-layara-souza-rezende:1.0 . 

      - name: Check vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          scan-type: Image
          image-ref: minimercado-layara-souza-rezende:1.0
          severity: HIGH, CRITICAL
          exit-code: '0'
          
      - name: Dockerhub login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USER_LAYARA}}
          password: ${{secrets.DOCKERHUB_TOKEN_LAYARA}}    

      - name: Docker Tag Image 
        run: docker tag minimercado-layara-souza-rezende:1.0 ${{secrets.DOCKERHUB_USER_LAYARA}}/minimercado-layara-souza-rezende:1.0
          
      - name: Push to Docker
        run: docker push ${{secrets.DOCKERHUB_USER_LAYARA}}/minimercado-layara-souza-rezende:1.0