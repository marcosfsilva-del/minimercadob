name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Lint com Ruff
        run: python3 tasks.py lint

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Testes com Pytest
        run: python3 tasks.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Build
        run: python3 tasks.py build
        
  docker-build:
      needs: build
      runs-on: ubuntu-latest
    
      steps:
        - name: Baixar codigo
          uses: actions/checkout@v4
    
        - name: Criar Imagem
          run: docker build -t minimercado-nomealuno:1.0 .
    
        - name: Checar Vulnerabilidades
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: image
            image-ref: minimercado-nomealuno:1.0
            severity: 'HIGH,CRITICAL'
            ignore-unfixed: true
            exit-code: '1'
