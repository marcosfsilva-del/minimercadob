name: CI Pipeline

on: [push]

jobs:
  lint:
    name: Job 1 - Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Ruff
        run: python -m pip install ruff

      - name: Executar Ruff
        run: python -m ruff check

  test:
    name: Job 2 - Testes (Pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Executar Pytest
        run: python -m pytest -v

  build:
    name: Job 3 - Build (compileall)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Executar compileall
        run: python -m compileall -q app scripts tasks.py 

  realese:
    name: docker-build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Criar imagem
        run: docker build -t minimercadob-marina:1.0 .
      - name: Checar Vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: minimercadob-marina:1.0
          severity: "HIGH,CRITICAL"
          exit-code: '0'
      - name: login no dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME_MARINA}}
          password: ${{secrets.DOCKER_TOKEN_MARINA}}
          
      - name: Rotular imagem e Push
        run: docker tag minimercadob-marina:1.0 ${{secrets.DOCKER_USERNAME_MARINA}}/minimercadob-marina:1.0
        
      - name: Push to Docker
        run: docker push ${{secrets.DOCKER_USERNAME_MARINA}}/minimercadob-marina:1.0
        
