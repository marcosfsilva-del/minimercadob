name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Lint com Ruff
        run: python -m ruff check .

  teste_unitario:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt


      - name: Testes com Pytest
        run: python -m pytest -v

  build:
    needs: teste_unitario
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt


      - name: Build com compileall
        run: python -m compileall -q app scripts tasks.py        

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        
      - name: Criar imagem
        run: docker build -t minimercadob-henriquechaves:1.0 .
        
      - name: Checar vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: minimercadob-henriquechaves:1.0
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Login no Dockerhub
        uses: docker/login-action@v3
        with: 
          username: ${{secrets.DOCKERHUB_USERNAME_HENRIQUE}}
          password: ${{secrets.DOCKERHUB_TOKEN_HENRIQUE}}

      - name: Rotular Imagem
        run: docker tag minimercadob-henriquechaves:1.0 ${{secrets.DOCKERHUB_USERNAME_HENRIQUE}}/minimercadob-henriquechaves:${GITHUB_SHA::7}

      - name: Push to Docker
        run: docker push ${{secrets.DOCKERHUB_USERNAME_HENRIQUE}}/minimercadob-henriquechaves:${GITHUB_SHA::7}

      - name: Rotular Imagem Latest
        run: docker tag minimercadob-henriquechaves:1.0 ${{secrets.DOCKERHUB_USERNAME_HENRIQUE}}/minimercadob-henriquechaves:latest

      - name: Push to Docker Latest
        run: docker push ${{secrets.DOCKERHUB_USERNAME_HENRIQUE}}/minimercadob-henriquechaves:latest

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no Render
        run: curl --request POST "${{secrets.DEPLOY_HOOK_HENRIQUE}}"

