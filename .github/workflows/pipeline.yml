name: CI
on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Lint com Ruff
        run: python -m ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Testes com Pytest
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Build com compileall
        run: python -m compileall -q app scripts tasks.py

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Criar Imagem
        run: docker build -t minimercado-gabrielcirino:1.0 .

      - name: Checar Vulnerabilidades
        uses: aquasecurity/trivy-action@v0.9.0
        with:
          scan-type: 'image'
          image-ref: 'minimercado-gabrielcirino:1.0'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_GABRIEL_CIRINO }}
          password: ${{ secrets.DOCKER_TOKEN_GABRIEL_CIRINO }}

      - name: Rotular Imagem
        run: docker tag minimercado-gabrielcirino:1.0 ${{ secrets.DOCKER_USERNAME_GABRIEL_CIRINO }}/minimercado-gabrielcirino:1.0

      - name: Push to Docker
        run: docker push ${{ secrets.DOCKER_USERNAME_GABRIEL_CIRINO }}/minimercado-gabrielcirino:1.0

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_GABRIEL_MARTINS_CIRINO }}"

      - name: Health Check do minimercado
        run: |
          BASE_URL="${{ vars.RENDER_MINIMERCADO_URL }}"
          BASE_URL="${BASE_URL%/}"
          if [ -z "$BASE_URL" ]; then
            echo "Erro: variavel RENDER_MINIMERCADO_URL nao configurada em Variables."
            exit 1
          fi
          for tentativa in $(seq 1 24); do
            echo "Tentativa ${tentativa}/24: ${BASE_URL}/api/health"
            if curl -fsS -m 10 "${BASE_URL}/api/health" | grep -Eq '"status":[[:space:]]*"ok"'; then
              echo "Health check passou!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check falhou"
          exit 1

