name: Pipeline

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Lint com Ruff
        run: python -m ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
    

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes com Pytest
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Build com compileall
        run: python -m compileall -q app scripts tasks.py

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Criar imagem
        run: docker build -t minimercado-jproliveira1:1.0 .
      - name: Checar vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: minimercado-jproliveira1:1.0
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      - name: login no dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERGUB_USERNAME_JPROLIVEIRA}}
          password: ${{secrets.DOCKERHUB_TOKEN_JPROLIVEIRA}}

      - name: Rotular Imagem
        run: docker tag minimercado-jproliveira1:1.0 ${{ secrets.DOCKERHUB_USERNAME_JPROLIVEIRA }}/minimercado-jproliveira1:1.0

      - name: Push Docker
        run: docker push ${{secrets.DOCKERHUB_USERNAME_JPROLIVEIRA }}/minimercado-jproliveira1:1.0 

