[project]
name = "devops-market"
version = "1.0.0"
description = "Mini mercado extensivel para disciplina de Integracao DevOps"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.0.3",
  "SQLAlchemy==2.0.54",
  "python-dotenv==1.0.1",
  "waitress==3.0.2"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/features"]
pythonpath = ["."]
addopts = "-p no:asyncio"
