{% extends "base.html" %}

{% block content %}
<section class="page-title">
  <div>
    <h2>Checkout</h2>
    <p>Compra simulada com persistencia do pedido.</p>
  </div>
</section>

<article class="panel narrow">
  <form method="post" action="{{ url_for('web.finish_checkout') }}" class="stack">
    <label>
      Nome do cliente
      <input type="text" name="customer_name" placeholder="Opcional">
    </label>
    <fieldset>
      <legend>Forma de entrega</legend>
      <label>
        <input type="radio" name="delivery_method" value="retirada" checked>
        Retirada
      </label>
      <label>
        <input type="radio" name="delivery_method" value="entrega">
        Entrega
      </label>
    </fieldset>
    <label>
      Endereço para entrega
      <input
        type="text"
        name="delivery_address"
        placeholder="Informe o endereço de entrega"
        disabled
      >
    </label>
    <div class="summary-line">
      <span>Itens</span>
      <strong>{{ items|length }}</strong>
    </div>
    <div class="summary-line">
      <span>Total</span>
      <strong>{{ total|brl }}</strong>
    </div>
    {% for slot in slot_renderers("CHECKOUT_FORM") %}
      {{ slot.renderer(items=items, total=total)|safe }}
    {% endfor %}
    <button type="submit" {% if not items %}disabled{% endif %}>Gerar pedido</button>
  </form>
</article>

<script>
  const deliveryMethodInputs = document.querySelectorAll('input[name="delivery_method"]');
  const deliveryAddressInput = document.querySelector('input[name="delivery_address"]');

  function updateDeliveryAddress() {
    const method = document.querySelector('input[name="delivery_method"]:checked').value;
    const isDelivery = method === "entrega";
    deliveryAddressInput.disabled = !isDelivery;
    deliveryAddressInput.required = isDelivery;
  }

  deliveryMethodInputs.forEach((input) => {
    input.addEventListener("change", updateDeliveryAddress);
  });

  updateDeliveryAddress();
</script>
{% endblock %}
