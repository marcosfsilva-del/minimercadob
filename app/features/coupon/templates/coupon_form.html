{% if summary %}
<div class="summary-line">
  <span>Desconto ({{ code }})</span>
  <strong>- {{ summary.discount|brl }}</strong>
</div>
<div class="summary-line">
  <span>Total final</span>
  <strong>{{ summary.total|brl }}</strong>
</div>
{% endif %}
<form method="post" action="{{ url_for('coupon.apply') }}" class="stack">
  <label>
    Cupom de desconto
    <input type="text" name="coupon" placeholder="Digite o código">
  </label>
  <button type="submit">Aplicar cupom</button>
</form>
