{% if promotions_active %}
  <div>
    <p>Exibindo apenas produtos promocionais</p>
    {% if not products %}
      <p>Nenhum produto em promoção no momento.</p>
    {% endif %}
    <a class="button-link" href="{{ url_for('web.catalog') }}">Ver todos os produtos</a>
  </div>
{% else %}
  <a class="button-link" href="{{ url_for('produtos_promocionais.catalog') }}">Ver promoções</a>
{% endif %}
