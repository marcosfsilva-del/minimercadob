<div class="stack cart-discount-summary">
  {% if summary.has_discount %}
    <div class="summary-line">
      <span>Subtotal</span>
      <span>{{ summary.subtotal|brl }}</span>
    </div>
    <div class="summary-line">
      <span>Desconto {{ summary.category }} ({{ summary.percent }}%)</span>
      <span>- {{ summary.discount|brl }}</span>
    </div>
  {% endif %}
  <div class="summary-line">
    <strong>Total final</strong>
    <strong>{{ summary.final_total|brl }}</strong>
  </div>
</div>
